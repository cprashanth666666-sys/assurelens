name: assurelens

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assurelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-assurelens}
    ports:
      # 5433 on the host, not 5432. A locally installed PostgreSQL service
      # commonly owns 5432 on a developer machine; when it does, connections
      # to localhost:5432 silently reach that instance instead of this
      # container and fail authentication against credentials that are
      # perfectly correct. Inside the compose network the backend still
      # reaches "postgres:5432" — only the host mapping moves.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assurelens}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Repo root: the image needs both backend/ and controls/.
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-assurelens}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-assurelens}
      CORS_ALLOW_ORIGINS: http://localhost:3000
      TARGET_SERVICE_URL: http://target_service:8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Mounted at the path CONTROLS_DIR names, so an edit to the library is
      # picked up without a rebuild. The image also carries its own copy.
      - ./controls:/opt/assurelens/controls:ro
    # Mirrors the Render start command, so local and deployed behave the same.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Deliberately vulnerable. Isolated: no database credentials, no route to
  # anything real. Suite 3 probes it over HTTP like an external tester. [TRD 1.2, 9]
  target_service:
    build: ./target_service
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    volumes:
      - ./target_service:/app

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
