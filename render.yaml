# Render blueprint — backend, target service and database.
# The frontend deploys to Vercel.
#
# Day 1 requirement: all three services live before any feature exists. A
# first deployment on the last day is the most common way a project ends up
# local-only. [PLAN §1]

# No database block. Render's Free PostgreSQL expires 30 days after creation,
# then after a 14-day grace period Render DELETES it and all its data (their
# docs, "Free Postgres / 30-day limit"). This link has to survive an
# application cycle measured in months, so Postgres lives on Neon's free plan
# instead, which has no expiry. See DEPLOY.md step 1.

services:
  - type: web
    name: assurelens-api
    runtime: docker
    plan: free
    # Match the Neon project's region (us-east-2, Ohio). Every boot upserts
    # the control library, which is ~150 round trips; across a continent that
    # is a minute, alongside the database. Co-located it is seconds.
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    # Repo root: the image needs controls/ as well as backend/.
    dockerContext: .
    healthCheckPath: /api/health
    # Migrations apply on every deploy, so the schema can never lag the code.
    # Seeding runs too: the control library is the product's content, not test
    # fixtures. Without it a deployed backend comes up with an empty library
    # and /api/engagement 404s — schema right, application useless.
    #
    # The control library is upserted every boot, so an edit ships with the
    # deploy. The synthetic estate is skipped when already present: it is bulk
    # data derived from a seed, so rebuilding 24,000 rows on every restart
    # changes nothing and takes long enough to fail this health check.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Paste the Neon connection string. The backend normalises a bare
      # "postgresql://" prefix to the psycopg driver, so either form works.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false          # set to the Vercel origin — never "*"
      # `host`, not `hostport`: hostport yields `name:443` with no scheme,
      # which httpx rejects. The backend's settings validator prefixes the
      # scheme, so either form is repaired — but host is the honest value.
      - key: TARGET_SERVICE_URL
        fromService:
          name: assurelens-target
          type: web
          property: host
      - key: LOG_LEVEL
        value: INFO

  # Deliberately vulnerable. Deployed separately and reached only over HTTP,
  # so a defect that is not network-reachable is not found — same as reality.
  # It holds no database credentials. [TRD 1.2, 9]
  - type: web
    name: assurelens-target
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./target_service/Dockerfile
    dockerContext: ./target_service
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: INFO
