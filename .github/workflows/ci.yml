name: CI

on:
  push:
    # `workd` is the working branch: the build lands there daily and merges to
    # main at milestones. CI has to cover it, or nine days of commits go
    # unchecked until the merge.
    branches: [main, workd]
  pull_request:

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assurelens
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: assurelens
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://assurelens:ci@localhost:5432/assurelens
      # The control-library tests need a real PostgreSQL: the schema depends on
      # JSONB, native enums and a partial unique index, so verifying against
      # SQLite would prove nothing about what ships. In CI the service is on
      # 5432; locally docker-compose publishes 5433 to dodge a locally
      # installed PostgreSQL that usually owns 5432.
      TEST_DATABASE_URL: postgresql+psycopg://assurelens:ci@localhost:5432/assurelens
      # The consent suite probes the deliberately-vulnerable target over HTTP,
      # exactly as it does in production. Without it running, those controls
      # correctly gate on G8_TARGET_UNREACHABLE -- and the findings tests that
      # expect S1 to be found fail, which is how main went red on Day 8.
      TARGET_SERVICE_URL: http://localhost:8001

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      # Migrations must apply cleanly from scratch on every PR. A migration
      # that only works against an existing database is a deployment failure
      # waiting to happen.
      - name: Migrate
        run: alembic upgrade head

      # Started as a process over real HTTP, not imported in-process: a
      # defect that is not network-reachable must not be found. [TRD 1.2]
      # Its only dependencies (fastapi, uvicorn, pydantic) come with the
      # backend install above.
      - name: Start target service
        working-directory: target_service
        run: |
          nohup uvicorn app:app --host 127.0.0.1 --port 8001 > /tmp/target.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8001/health && exit 0
            sleep 1
          done
          echo "target service did not become healthy"; cat /tmp/target.log; exit 1

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # NEXT_PUBLIC_* is inlined at build time, so the production build
      # refuses to run without it. Setting it here both satisfies that guard
      # and documents that it is a build-time input, not a runtime one.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
