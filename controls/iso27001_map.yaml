# ISO/IEC 27001:2022 Annex A cross-references.
#
# Why these exist: a client already running an ISO 27001 programme has
# evidence sitting in an existing control set. Showing which Annex A control
# already covers a DPDP obligation tells them what they can reuse, which is a
# genuine consulting insight rather than decoration. [PRD 5.3]
#
# ---------------------------------------------------------------------------
# HONESTY NOTE — every clause here is marked UNVERIFIED, deliberately.
#
# ISO/IEC 27001:2022 is a paid standard. This project has not purchased it, so
# the control titles below are recorded from working knowledge and have NOT
# been checked against the published text. Marking them VERIFIED would be
# exactly the unsupported assertion this product exists to refuse.
#
# This does not gate the controls. G7_SOURCE_UNVERIFIED considers only a
# control's PRIMARY clause, which is always a DPDP provision read from the
# gazette. These are secondary cross-references: useful for navigation,
# never load-bearing for a verdict. The UI labels them as unverified so a
# reader knows which citations carry weight.
#
# To close: obtain ISO/IEC 27001:2022, confirm each reference and title, and
# flip source_status. Tracked as SOURCES.md open item D8.
# ---------------------------------------------------------------------------

framework:
  code: ISO27001
  name: ISO/IEC 27001:2022 — Information security management systems
  version: "2022"
  authority: International Organization for Standardization
  source_url: https://www.iso.org/standard/27001

